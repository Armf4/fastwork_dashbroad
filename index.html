<style>
:root{--ac:#141416;--ac2:#1f9a8a;--tx:#141416;--mu:rgba(20,20,22,.6);--gl:rgba(255,255,255,.5);--bd:rgba(255,255,255,.85);--bg:radial-gradient(900px 600px at 80% 0%,rgba(255,255,255,.9),transparent 60%),#e6e6ea;--sh:0 16px 40px rgba(20,20,30,.12),inset 0 1px 0 rgba(255,255,255,.9);--th:#f1f4f8;--sel:#141416;--selt:#fff;--ct:#2a2a30;--cg:rgba(0,0,0,.08);--c1:#141416;--c2:#1f9a8a;--c3:#6b6b75;--c4:#3a3a40;--c5:#9a9aa5;--c6:#5a5a62}
html.dark{--ac:#f5f5f7;--ac2:#7fe3d6;--tx:#f5f5f7;--mu:rgba(245,245,247,.55);--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--bg:radial-gradient(900px 600px at 80% 0%,rgba(140,140,150,.22),transparent 60%),#17171a;--sh:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);--th:#1c1c20;--sel:#f5f5f7;--selt:#141416;--ct:#cfd2da;--cg:rgba(255,255,255,.06);--c1:#f5f5f7;--c2:#7fe3d6;--c3:#8c8c96;--c4:#e6e1d6;--c5:#a9a9b3;--c6:#d9d2c5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sarabun',sans-serif;color:var(--tx);background:var(--bg);background-attachment:fixed;min-height:100vh}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);box-shadow:var(--sh)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;width:calc(100% - 24px);max-width:1176px;margin:12px auto;border-radius:16px}
.btn{font:inherit;color:var(--tx);background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--selt);border-color:transparent;font-weight:700}
.btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:1.1rem}
aside{position:fixed;top:12px;bottom:12px;left:12px;width:230px;padding:18px 12px;transform:translateX(-120%);transition:transform .35s cubic-bezier(.2,.7,.2,1);z-index:30;overflow:auto}
body.open aside{transform:none}
aside .btn{display:block;width:100%;text-align:left;margin-bottom:8px;border:0;background:transparent}
aside .btn.on{background:var(--sel);color:var(--selt);box-shadow:none}
main{padding:92px 18px 30px;transition:margin .35s;max-width:1200px;margin-left:auto;margin-right:auto;min-width:0}
@media(min-width:900px){body.open main{margin-left:254px}body.open aside{transform:none}}
h1{margin:4px 0 6px;font-size:clamp(1.4rem,4vw,1.9rem)}
canvas{max-width:100%}
h3{margin:0;font-size:1rem;font-weight:600}
.muted{color:var(--mu);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:20px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));margin:18px 0}
.kpi .glass{padding:18px}
.kpi b{display:block;font-size:1.6rem;margin-top:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.charts{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px}
.charts .glass{cursor:pointer}
.charts .cb{height:170px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.charts .glass.open{grid-column:1/-1}
.charts .glass.open .cb{height:440px}
.charts .glass{padding:22px}
.cb{position:relative;height:340px;margin-top:12px}
.tbl{overflow:auto;max-height:360px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.07)}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--th);color:var(--mu);font-weight:600}
tr.t td{font-weight:700;color:var(--ac)}
.rv{animation:clipin .6s cubic-bezier(.22,1,.36,1) both}
@keyframes clipin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.rv.in{clip-path:inset(0 0 0 0)}
.mvs{display:none;gap:4px;align-items:center}
body.edit .mvs{display:inline-flex}
body.edit .glass[data-cid]{outline:1px dashed rgba(255,179,122,.45);outline-offset:4px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mvb{padding:4px 10px;font-size:.8rem}
.brand{width:30px;height:30px;border-radius:9px;overflow:hidden;display:block;flex:none}
.brand svg{width:30px;height:30px;display:block}
#menu{background:var(--sel);color:var(--selt);border-color:transparent;box-shadow:var(--sh)}
.ios{width:44px;height:44px;border:0;border-radius:12px;display:grid;place-items:center;cursor:pointer;background:linear-gradient(145deg,#4a4a52,#1e1e22);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.ios:active{transform:scale(.96)}
#ebar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;padding:8px 12px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.rv{animation:none}}
/* ===== หน้าแรก: scrollytelling ===== */
body.isIntro main{padding:0}
:root{--cardf:#ffffff;--cardt:#d4f0eb;--barf:#e8e2d6;--line:rgba(20,20,22,.12)}
.intro{--hal:#e6e6ea;--sc:#168a7a;--glow:rgba(22,138,122,.28)}
html.dark{--cardf:#1f3336;--cardt:#2f5558;--barf:#2b2b30;--line:rgba(255,255,255,.1)}
html.dark .intro{--hal:#17171a;--sc:#7fe3d6;--glow:rgba(127,227,214,.35)}
.intro *{box-sizing:border-box}
.intro a{color:inherit}
.intro .pill{display:inline-block;background:var(--sel);color:var(--selt);padding:11px 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.92rem}
.intro .pill.ghost{background:transparent;color:var(--tx);border:1px solid var(--tx)}
.intro .hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:120px 56px 40px;max-width:1280px;margin:0 auto}
.intro h1{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:clamp(2.6rem,6vw,5rem);line-height:1.1;margin:0 0 22px}
.intro h2{font-family:'Noto Serif Thai',serif;font-size:clamp(2rem,4.4vw,3.6rem);margin:0 0 18px}
.intro .lead{font-size:1.05rem;color:var(--mu);max-width:500px;line-height:1.7;margin:0 auto 30px}
.intro .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.intro .story{height:500vh;position:relative}
.intro .df{height:100vh;position:sticky;top:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:76px 0 0}
.intro .stage{width:min(1400px,100%);height:100%;position:relative;display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.45fr);grid-template-rows:minmax(0,1fr);align-items:center;padding:0 72px 0 56px}
.intro .scene{grid-column:2;grid-row:1;position:relative;width:100%;height:100%;max-height:78vh;align-self:center;justify-self:end}
.intro .ln{fill:none;stroke:var(--sc);stroke-width:3;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120}
.intro .s-card{fill:var(--cardf);stroke:var(--sc)}
.intro .s-top{fill:var(--cardt);stroke:var(--ac2)}
.intro .s-bar{fill:var(--barf)}
.intro .s-acc{fill:var(--ac2)}
.intro .txt{font-family:Sarabun,sans-serif;fill:var(--tx);font-size:25px;font-weight:700;paint-order:stroke;stroke:var(--hal);stroke-width:7px;stroke-linejoin:round}
.intro #merged .txt{font-size:30px}
.intro .dbi,.intro #merged{filter:drop-shadow(0 6px 14px var(--glow))}
.intro .pop{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.intro .pop.in{animation:pop .7s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.3)}55%{opacity:1;transform:translateY(-6px) scale(1.25)}78%{transform:translateY(1px) scale(.94)}100%{opacity:1;transform:none}}
.intro .cap>.in{animation:capin .65s cubic-bezier(.3,1.35,.5,1) both}
@keyframes capin{0%{opacity:0;transform:translateY(28px) scale(.9)}60%{opacity:1;transform:translateY(-5px) scale(1.03)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro .pop{opacity:1}.intro .pop.in,.intro .cap>.in{animation:none}}
.intro .cap{grid-column:1;grid-row:1;align-self:center;justify-self:start;z-index:4;max-width:400px}
.intro .cap em{display:block;font-style:normal;font-size:.8rem;letter-spacing:.14em;color:var(--sc);font-weight:700;margin-bottom:18px}
.intro .cap b{display:block;font-family:'Noto Serif Thai',serif;font-size:clamp(2rem,3.8vw,3.4rem);line-height:1.2;margin-bottom:18px}
.intro .cap span{display:block;font-size:1rem;line-height:1.7;color:var(--mu);margin-bottom:28px}
.intro .dots{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:6}
.intro .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tx);opacity:.35;transition:.25s}
.intro .dots i.on{background:var(--tx);opacity:1;transform:scale(1.25)}
.intro .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line);z-index:5}
.intro .bar i{display:block;height:100%;width:0;background:var(--tx)}
.intro .d-win{fill:var(--cardf);stroke:var(--sc);stroke-width:2.5}
.intro .d-br{fill:var(--barf)}
.intro .d-tile{fill:var(--cardt)}
.intro .d-ac{fill:var(--sc)}
.intro .d-tx{fill:var(--tx);font-family:Sarabun,sans-serif;font-size:19px;font-weight:600}
.intro .d-big{font-size:34px;font-weight:700}
.intro .d-mu{fill:var(--tx);opacity:.6;font-family:Sarabun,sans-serif;font-size:17px;font-weight:600}
.intro .d-up{fill:var(--sc);font-family:Sarabun,sans-serif;font-size:17px;font-weight:700}
.intro .d-ln{fill:none;stroke:#ffb37a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.intro .d-track{fill:none;stroke:var(--barf);stroke-width:16}
.intro .d-arc{fill:none;stroke:var(--sc);stroke-width:16;stroke-dasharray:1;stroke-dashoffset:1}
.intro .d-bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.intro .d-hb{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}
.intro .cta{padding:120px 56px;text-align:center}
.intro .cta p{color:var(--mu);max-width:560px;margin:0 auto 32px;line-height:1.7}
.intro footer{padding:40px 56px;border-top:1px solid var(--line);color:var(--mu);font-size:.88rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.intro .tq-wrap{width:100%;min-width:0}
.intro .tq-q{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:clamp(1.8rem,4.6vw,3.4rem);line-height:1.35;min-height:2.7em;width:100%;max-width:1100px;margin:0 auto 34px;display:block;text-align:center;min-width:0}
.intro .tq-q span{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;text-align:center}
.intro .tq-cur{display:inline-block;width:3px;height:.95em;margin-left:4px;margin-top:.15em;background:var(--tx);border-radius:2px;animation:tqblink 1s steps(1) infinite}
@keyframes tqblink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.intro .tq-cur{animation:none}}
@media (max-width:860px){.intro .hero{padding:96px 22px 40px}.intro .stage{padding:0 34px 0 18px;grid-template-columns:1fr;grid-template-rows:auto 1fr}.intro .scene{grid-column:1;grid-row:2;max-height:none;height:auto;width:100%;aspect-ratio:1000/600;align-self:center;justify-self:stretch}.intro .cap{grid-column:1;grid-row:1;align-self:start;margin-top:14px}.intro .cap b{font-size:1.45rem;line-height:1.25;margin-bottom:8px}.intro .cap em{margin-bottom:8px}.intro .cap span{margin-bottom:12px;font-size:.85rem;line-height:1.55}.intro .dots{right:12px}.intro .cta{padding:80px 22px}.intro footer{padding:30px 22px}}

/* ===== หน้าโหลดแอป: ไอคอนขีดเด้ง ===== */
#splash{--sbg:#e6e6ea;--stile:#ffffff;--b1:#141416;--b2:#1f9a8a;--b3:#8c8c96;position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--sbg);transition:opacity .5s ease,visibility .5s;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){#splash{--sbg:#17171a;--stile:#1e1e22;--b1:#f5f5f7;--b2:#c9b8a3;--b3:#8c8c96}}
#splash.hide{opacity:0;visibility:hidden}
.sp-tile{width:160px;height:160px;border-radius:36px;background:var(--stile);display:flex;align-items:flex-end;justify-content:center;gap:15px;padding-bottom:34px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sp-tile i{display:block;width:20px;height:92px;border-radius:9px;transform-origin:50% 100%;animation:sp-bounce 1.1s ease-in-out infinite}
.sp-tile i:nth-child(1){background:var(--b1);animation-duration:.9s}
.sp-tile i:nth-child(2){background:var(--b2);animation-duration:1.15s;animation-delay:-.3s}
.sp-tile i:nth-child(3){background:var(--b3);animation-duration:1s;animation-delay:-.6s}
@keyframes sp-bounce{0%,100%{transform:scaleY(.33)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.sp-tile i{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="splash" aria-label="กำลังโหลด"><div class="sp-tile"><i></i><i></i><i></i></div></div>
<header class="top glass"><button class="btn icon" id="menu" aria-label="เปิดเมนู">☰</button><span class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#1e1e22"/><rect x="14" y="30" width="8" height="20" rx="3" fill="#f5f5f7"/><rect x="28" y="20" width="8" height="30" rx="3" fill="#c9b8a3"/><rect x="42" y="12" width="8" height="38" rx="3" fill="#8c8c96"/></svg></span><b>แดชบอร์ด</b><span class="muted" style="margin-left:auto">ข้อมูลตัวอย่าง ก.ย. – พ.ย. 2026</span><button class="ios" id="thm" aria-label="โหมดมืด"></button></header>
<aside class="glass">
  <button class="btn on" data-v="intro">หน้าแรก</button>
  <button class="btn" data-v="home">ภาพรวมธุรกิจ</button>
  <button class="btn" data-v="food">ธุรกิจอาหาร</button>
  <button class="btn" data-v="online">ขายของออนไลน์</button>
  <button class="btn" data-v="social">วัดผลโซเชียล</button>
  <button class="btn" data-v="fin">รายรับ / รายจ่าย</button>
</aside>
<main id="main"></main>
<template id="introT"><div class="intro"><section class="hero">
  <div class="tq-wrap">
    <div class="tq-q"><span id="tq"></span><i class="tq-cur" aria-hidden="true"></i></div>
  </div>
  <p class="lead">รวมข้อมูลจากทุกแหล่งเข้าเป็นฐานเดียว ส่งออกไปยังโปรแกรมทำแดชบอร์ด แล้วขึ้นคลาวด์เป็นเว็บไซต์ เลื่อนลงไปดูทีละขั้น</p>
  <div class="btns"><a class="pill" href="#story">เริ่มดูการทำงาน</a><a class="pill ghost" href="#" data-v="home">ดูแดชบอร์ดตัวอย่าง</a></div>
</section>

<section class="story" id="story">
  <div class="df"><div class="stage">
    <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>

    <svg class="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <g id="dbShape">
          <path d="M-34 -22 V18 A34 10 0 0 0 34 18 V-22 A34 10 0 0 0 -34 -22Z" style="fill:var(--cardf);stroke:var(--sc)" stroke-width="2"/>
          <ellipse cx="0" cy="-22" rx="34" ry="10" style="fill:var(--cardt);stroke:var(--sc)" stroke-width="2"/>
        </g>
      </defs>

      <g id="diagram">
      <g class="dbi" data-x="180" data-y="160" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">ยอดขาย</text></g>
      <g class="dbi" data-x="420" data-y="130" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">หน้าร้าน</text></g>
      <g class="dbi" data-x="760" data-y="150" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">โซเชียล</text></g>
      <g class="dbi" data-x="160" data-y="400" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">ออเดอร์</text></g>
      <g class="dbi" data-x="480" data-y="420" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">รายจ่าย</text></g>
      <g class="dbi" data-x="800" data-y="400" style="opacity:0"><use href="#dbShape"/><text class="txt pop" y="60" text-anchor="middle">CRM</text></g>

      <g id="merged" transform="translate(500,300)" style="opacity:0">
        <use href="#dbShape" transform="scale(2.2)"/>
        <text class="txt" y="100" text-anchor="middle" font-size="20" font-weight="700">ฐานข้อมูลเดียว</text>
      </g>

      <path id="up" class="ln" d="M500 260 L500 152"/>
      <path id="down" class="ln" d="M500 340 L500 378"/>
      <g id="xl" style="opacity:0"><rect x="-40" y="-40" width="80" height="80" rx="16" fill="#1d6f42"/><text y="14" text-anchor="middle" font-size="44" font-weight="700" fill="#fff" font-family="Sarabun">X</text><text class="txt" y="66" text-anchor="middle">Excel</text></g>
      <g id="pbi" style="opacity:0"><rect x="-40" y="-40" width="80" height="80" rx="16" fill="#f2c811"/><rect x="-22" y="4" width="11" height="20" fill="#333"/><rect x="-6" y="-8" width="11" height="32" fill="#333"/><rect x="10" y="-22" width="11" height="46" fill="#333"/><text class="txt pbl" y="66" text-anchor="middle">Power BI</text></g>
      <g id="gs" style="opacity:0"><rect x="-40" y="-40" width="80" height="80" rx="16" fill="#0f9d58"/><rect x="-24" y="-22" width="48" height="44" fill="none" stroke="#fff" stroke-width="3"/><line x1="-24" y1="-6" x2="24" y2="-6" stroke="#fff" stroke-width="2"/><line x1="0" y1="-22" x2="0" y2="22" stroke="#fff" stroke-width="2"/><text class="txt" y="66" text-anchor="middle">Sheets</text></g>

const iclamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const iease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
let IN = null;
function viewIntro() {
  $('#main').innerHTML = '';
  $('#main').appendChild($('#introT').content.cloneNode(true));
  startTyping();
  const g = id => document.getElementById(id);
  IN = { story: g('story'), dbis: [...document.querySelectorAll('.dbi')], merged: g('merged'), xl: g('xl'), pbi: g('pbi'), gs: g('gs'),
    cloud: g('cloud'), web: g('web'), up: g('up'), down: g('down'), st: g('st'), ct: g('ct'), cx: g('cx'), bi: g('bi'),
    dots: [...document.querySelectorAll('#dots i')],

}
function updIntro() {
  if (S.v !== 'intro' || !IN || !IN.story.isConnected) return;
  const { story, dbis, merged, xl, pbi, gs, cloud, web, up, down, st, ct, cx, bi, dots, diagram, dash, dw } = IN;
  const CX = 500, CY = 300;
  const apps = [[xl, 330, 300, 0], [pbi, 500, 300, 1], [gs, 670, 300, 2]];
  const r = story.getBoundingClientRect();
  const total = story.offsetHeight - innerHeight;
  const p0 = iclamp(-r.top / total);
  const p = iclamp(p0 / 0.8);
  bi.style.width = (p0 * 100) + '%';
  dbis.forEach((g, i) => {
    const bx = +g.dataset.x, by = +g.dataset.y;
    const appear = iease(iclamp((p - i * 0.015) / 0.1));
    const t = iease(iclamp((p - 0.25 - i * 0.012) / 0.22));
    const x = bx + (CX - bx) * t, y = by + (CY - by) * t;
    const s = (0.7 + 0.3 * appear) * (1 - 0.6 * t);
    g.setAttribute('transform', `translate(${x},${y}) scale(${s})`);
    g.style.opacity = appear * (1 - iease(iclamp((p - 0.42) / 0.06)));
    const lb = g.querySelector('.pop');
    if (appear > 0.45) lb.classList.add('in'); else if (appear < 0.05) lb.classList.remove('in');
  });
  merged.style.opacity = iease(iclamp((p - 0.4) / 0.08)) * (1 - iease(iclamp((p - 0.5) / 0.06)));
  apps.forEach(([el, fx, fy, k]) => {
    const t = iease(iclamp((p - 0.55 - k * 0.03) / 0.14));
    const x = CX + (fx - CX) * t, y = CY + (fy - CY) * t;
    el.setAttribute('transform', `translate(${x},${y}) scale(${0.4 + 0.6 * t})`);
    let o = t;
    if (k !== 1) o *= 1 - iease(iclamp((p - 0.76) / 0.06));
    el.style.opacity = o;
  });
  up.style.strokeDashoffset = 120 * (1 - iease(iclamp((p - 0.8) / 0.06)));
  const pl = iease(iclamp((p - 0.76) / 0.05));
  pbi.querySelector('.pbl').setAttribute('transform', `translate(${96 * pl},${-58 * pl})`);
  cloud.style.opacity = iease(iclamp((p - 0.84) / 0.06));
  down.style.strokeDasharray = '120';
  down.style.strokeDashoffset = 120 * (1 - iease(iclamp((p - 0.9) / 0.04)));
  web.style.opacity = iease(iclamp((p - 0.92) / 0.06));
  const dsh = iease(iclamp((p0 - 0.8) / 0.06));
  diagram.style.opacity = 1 - dsh;
  dash.style.opacity = dsh;
  const dp = iclamp((p0 - 0.84) / 0.12);
  dw.forEach((w, i) => {
    const t = iease(iclamp((dp - i * 0.1) / 0.4));
    w.style.opacity = t;
    w.setAttribute('transform', `translate(0,${(1 - t) * 16})`);
    w.querySelectorAll('.d-ln').forEach(el => el.style.strokeDashoffset = 1 - t);
    w.querySelectorAll('.d-arc').forEach(el => el.style.strokeDashoffset = 1 - t * 0.42);
    w.querySelectorAll('.d-bar').forEach((el, j) => el.style.transform = `scaleY(${iease(iclamp(t * 1.6 - j * 0.12))})`);
    w.querySelectorAll('.d-hb').forEach((el, j) => el.style.transform = `scaleX(${iease(iclamp(t * 1.6 - j * 0.15))})`);
  });
  const idx = p0 < 0.2 ? 0 : p0 < 0.4 ? 1 : p0 < 0.6 ? 2 : p0 < 0.8 ? 3 : 4;
  st.textContent = INTRO_STEPS[idx][0];
  ct.textContent = INTRO_STEPS[idx][1];
  cx.textContent = INTRO_STEPS[idx][2];
  dots.forEach((d, i) => d.classList.toggle('on', i === idx));
  if (idx !== IN.last) {
    IN.last = idx;
    document.querySelectorAll('.cap > *').forEach((el, k) => {
      el.classList.remove('in'); void el.offsetWidth;
      el.style.animationDelay = (k * 0.08) + 's'; el.classList.add('in');
    });
  }
}

function moveCard(btn, dir) {

}

  b.textContent = show ? 'ซ่อนตาราง' : 'ดูตาราง';
});

function render() {
  kill();
  document.querySelectorAll('aside [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === S.v));
  document.body.classList.toggle('isIntro', S.v === 'intro');
  if (S.v === 'intro') viewIntro(); else if (S.v === 'home') viewHome(); else if (S.v === 'fin') viewFin(); else viewBiz(S.v);

  applyChartTheme();
  observe();
}

const io = new IntersectionObserver(es => es.forEach(e => {
  e.target.classList.toggle('in', e.isIntersecting);
  if (!e.isIntersecting) return;
  e.target.querySelectorAll('canvas').forEach(cv => { const c = Chart.getChart(cv); if (c) { c.reset(); c.update(); } });
}), { threshold: .15 });
function observe() { document.querySelectorAll('.rv').forEach(el => io.observe(el)); }

Chart.register({ id: 'run', afterDatasetsDraw(c) {
  if (true) return;
  const pts = c.getDatasetMeta(0).data;
  if (pts.length < 2) return;
  const f = ((performance.now() / 3000) % 1) * (pts.length - 1), i = Math.floor(f), j = Math.min(i + 1, pts.length - 1), k = f - i;
  const x = pts[i].x + (pts[j].x - pts[i].x) * k, y = pts[i].y + (pts[j].y - pts[i].y) * k;
  const ctx = c.ctx; ctx.save(); ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffb37a'; ctx.shadowBlur = 18; ctx.fill(); ctx.restore();
} });
(function loop() { charts.forEach(c => { if (c.options.plugins && c.options.plugins.run) c.draw(); }); requestAnimationFrame(loop); })();

document.addEventListener('click', e => {
  const t = e.target.closest('[data-v],[data-m],[data-f],[data-menu]');
  if (!t) return;
  if (t.dataset.v) { S.v = t.dataset.v; document.body.classList.remove('open'); }
  else if (t.dataset.m !== undefined) S.m = +t.dataset.m;
  else if (t.dataset.menu !== undefined) S.menu = t.dataset.menu;
  else S.fm = t.dataset.f;
  render();
  if (!t.dataset.menu) window.scrollTo(0, 0);
});
let SND = true, AC = null;
function tick() {
  if (!SND) return;
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(700, t + .05);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .1);
}
const ICON_MOON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const OLDHEX = {'#ffb37a':'--c1','#4fd1c5':'--c2','#8ab4ff':'--c3','#c9a7ff':'--c4','#ff8fb1':'--c5','#f6e05e':'--c6'};
const OLDRGB = {'255,179,122':'--c1','79,209,197':'--c2','138,180,255':'--c3','201,167,255':'--c4','255,143,177':'--c5','246,224,94':'--c6'};
const toRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); };
function recolor(cs) {
  const val = v => cs.getPropertyValue(v).trim();
  window.C1RGB = toRGB(val('--c1'));
  const conv = v => {
    if (Array.isArray(v)) return v.map(conv);
    if (typeof v !== 'string') return v;
    const k = v.toLowerCase();
    if (OLDHEX[k]) return val(OLDHEX[k]);
    const m = v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) { const key = m[1] + ',' + m[2] + ',' + m[3]; if (OLDRGB[key]) return v.replace(m[0], (m[0].startsWith('rgba') ? 'rgba(' : 'rgb(') + toRGB(val(OLDRGB[key]))); }
    return v;
  };
  charts.forEach(c => c.data.datasets.forEach(d => ['borderColor', 'backgroundColor', 'pointBackgroundColor', 'pointHoverBackgroundColor', 'pointHoverBorderColor'].forEach(k => {
    if (d[k] === undefined || typeof d[k] === 'function') return;
    d.$o = d.$o || {}; if (!(k in d.$o)) d.$o[k] = d[k];
    d[k] = conv(d.$o[k]);
  })));
}
function applyChartTheme() {
  const cs = getComputedStyle(document.documentElement), col = cs.getPropertyValue('--ct').trim(), grid = cs.getPropertyValue('--cg').trim();
  Chart.defaults.color = col;
  recolor(cs);
  charts.forEach(c => {
    const o = c.options;
    if (o.plugins && o.plugins.legend && o.plugins.legend.labels) o.plugins.legend.labels.color = col;
    if (o.plugins && o.plugins.tooltip) { const dk = document.documentElement.classList.contains('dark'); Object.assign(o.plugins.tooltip, { backgroundColor: dk ? 'rgba(16,18,26,.94)' : 'rgba(255,255,255,.97)', borderColor: dk ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.12)', titleColor: dk ? '#ffffff' : '#141416', bodyColor: dk ? '#f5f5f7' : '#141416' }); }
    if (o.scales) Object.values(o.scales).forEach(s => { if (s.ticks) s.ticks.color = col; if (s.grid) s.grid.color = grid; });
    c.update('none');
  });

function setMode(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $('#thm').innerHTML = dark ? ICON_SUN : ICON_MOON;
  applyChartTheme();
}
$('#thm').onclick = () => setMode(!document.documentElement.classList.contains('dark'));
document.addEventListener('click', e => { if (e.target.closest('button, a.pill, [data-v], [data-m], [data-f], [data-menu]')) tick(); }, true);
$('#menu').onclick = () => document.body.classList.toggle('open');

const SPL = document.getElementById('splash'), SPL_T0 = Date.now();
let splDone = false;
function hideSplash() {
  if (splDone) return; splDone = true;
  const wait = Math.max(0, 1400 - (Date.now() - SPL_T0));
  setTimeout(() => SPL.classList.add('hide'), wait);
  setTimeout(() => SPL.remove(), wait + 600);
}
if (document.readyState === 'complete') hideSplash(); else addEventListener('load', hideSplash);
setTimeout(hideSplash, 6000);

render();
setMode(false);
</script>
