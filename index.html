.glass{background:var(--gl);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);box-shadow:var(--sh)}

let qCur = -1, qShown = 0, qSegs = [];
function qAddChar(tq, g, last) {
  if (g === '\n') tq.appendChild(document.createElement('br'));
  else if (g === '?' && last) { const s = document.createElement('span'); s.className = 'tq-qm'; s.textContent = '?'; tq.appendChild(s); }
  else tq.appendChild(document.createTextNode(g));

function updQ() {
  const qs = document.getElementById('qs');
  if (S.v !== 'intro' || !qs || !qs.isConnected) return;
  const tq = document.getElementById('tq');
  const r = qs.getBoundingClientRect();
  const total = qs.offsetHeight - innerHeight;
  const p = iclamp(-r.top / total) * TQ.length;
  const idx = Math.min(TQ.length - 1, Math.floor(p));
  const cue = document.getElementById('scCue');
  if (cue) cue.classList.toggle('hide', p > 0.05);
  const f = p - idx;                       // 0..1 ภายในช่วงของคำถามข้อนี้
  const last = idx === TQ.length - 1;
  if (idx !== qCur) { qCur = idx; qShown = 0; qSegs = tsplit(TQ[idx]); tq.textContent = ''; }
  const L = qSegs.length;
  let want;
  if (f < 0.6) want = Math.round(L * f / 0.6);
  else if (last) want = L;                  // ข้อสุดท้ายค้างไว้ ไม่ลบ
  else if (f < 0.85) want = L;
  else want = Math.round(L * (1 - (f - 0.85) / 0.15));
  while (qShown < want) { qAddChar(tq, qSegs[qShown], last); qShown++; }
  while (qShown > want) { tq.lastChild && tq.lastChild.remove(); qShown--; }
}

function parseCSV(t){
  const rows=[];
  for(const line of t.trim().split(/\r?\n/).slice(0,200)){
    const p=line.split(/[,\t;]/);if(p.length<2)continue;
    const v=parseFloat(p[1].replace(/[฿\s]/g,''));
    if(isFinite(v))rows.push([p[0].trim()||'-',v]);
  }
  return rows;
}

function initSceneLive() {
  const I = IN, NS = 'http://www.w3.org/2000/svg', N = 5;

  I.cb = [...document.querySelectorAll('#web .wcb')];

  const pt = document.getElementById('pt');
  I.parts = [];
  [[I.up, 'var(--sc)', 0], [I.down, 'var(--c1)', 1]].forEach(([path, col, k]) => {
    const len = path.getTotalLength();
    for (let i = 0; i < N; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', 5); c.setAttribute('fill', col); c.setAttribute('opacity', 0);
      pt.appendChild(c);

  });

    const bt = I.bt == null ? null : (now - I.bt) / 1000;

    I.parts.forEach(q => {
      if (!on[q.k]) { q.c.setAttribute('opacity', 0); return; }
      const u = (now / 2000 + q.i / N) % 1, pnt = q.path.getPointAtLength(u * q.len);
      q.c.setAttribute('cx', pnt.x); q.c.setAttribute('cy', pnt.y);
      q.c.setAttribute('opacity', Math.sin(Math.PI * u));
    });
    I.cb.forEach((b, i) => {
      let k = bt == null ? 0 : iease(iclamp((bt - 0.2 - i * 0.25) / 0.6));
      if (bt != null && bt > 1.8) k *= 1 + 0.05 * Math.sin(now / 330 + i);

const barMulti = (labels, a, b) => ({ type: 'bar', data: { labels, datasets: [{ label: 'รายได้', data: a, backgroundColor: '#ffb37a', borderRadius: 6 }, { label: 'ต้นทุน', data: b, backgroundColor: '#4fd1c5', borderRadius: 6 }] }, options: opt(true, { scales: axes }) });

function viewFin() {
  const idx = DAYS.map((D, i) => i).filter(i => S.m < 0 || DAYS[i].m === S.m);

  const sumInc = sumOf(inc, x => x), sumExp = sumOf(exp, x => x);
  const modes = [['both', 'เทียบรายรับ-รายจ่าย'], ['inc', 'รายรับ'], ['exp', 'รายจ่าย']];
  const tabs = `<div class="row" style="margin-bottom:6px">${modes.map(([k, t]) => `<button class="btn ${S.fm === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')}</div>`;

  if (S.fm !== 'inc') sets.push({ label: 'รายจ่าย', data: exp, borderColor: '#4fd1c5', backgroundColor: 'rgba(79,209,197,.15)', fill: S.fm === 'exp', tension: .35, pointRadius: 0, borderWidth: 2.5 });

    `<div class="grid charts">${chartCard('เทียบรายวัน', 'c1')}${S.fm !== 'exp' ? chartCard('สัดส่วนรายรับตามช่องทาง', 'c2') : ''}${S.fm !== 'inc' ? chartCard('สัดส่วนรายจ่ายตามประเภท', 'c3') + chartCard('สัดส่วนรายจ่ายตามร้านค้า', 'c4') : ''}</div>` +
    `<div class="glass rv" style="margin-top:20px"><div class="chead"><h3>ตารางรายวัน</h3><button class="btn mvb" data-tb>ดูตาราง</button></div><div class="tbl" style="display:none"><table><tr><th>วันที่</th><th>รายรับ</th><th>รายจ่าย</th><th>คงเหลือ</th></tr>${rowsHtml}</table></div></div>`;
  const incCh = FCH.map(c => sumOf(idx.map(i => FI[i].ch[c]), x => x));
  const monFE = FE.filter(r => S.m < 0 || r.m === S.m);
  const expCat = FCAT.map(c => sumOf(monFE.filter(r => r.cat === c), r => r.amt));
  const expSt = FST.map(s => sumOf(monFE.filter(r => r.st === s), r => r.amt));
  if (S.fm !== 'exp') mk('c2', pieCfg(FCH, incCh));
  if (S.fm !== 'inc') { mk('c3', pieCfg(FCAT, expCat)); mk('c4', pieCfg(FST, expSt)); }
  mk('c1', { type: 'line', data: { labels, datasets: sets }, options: { ...opt(true, { scales: axes, interaction: { mode: 'index', intersect: false } }), plugins: { legend: { display: true, position: 'bottom', labels: { color: '#cfd6e2' } }, tooltip: TT } } });
}

function viewFinOld() {
  const tabs = `<div class="row" style="margin-bottom:6px"><button class="btn ${S.fm === 'inc' ? 'on' : ''}" data-f="inc">รายรับ</button><button class="btn ${S.fm === 'exp' ? 'on' : ''}" data-f="exp">รายจ่าย</button></div>`;

    $('#main').innerHTML = head('รายรับ / รายจ่าย') + tabs +
      `<div class="grid kpi">${card('ค่าใช้จ่ายรวม', fk(all))}${card('ประเภทสูงสุด', FCAT[catT.indexOf(Math.max(...catT))])}${card('ร้านค้าสูงสุด', FST[stT.indexOf(Math.max(...stT))])}${card('จำนวนรายการ', R.length.toLocaleString('th-TH'))}</div>` +
      `<div class="grid charts">${chartCard('ค่าใช้จ่ายตามประเภท', 'c1')}${chartCard('ค่าใช้จ่ายตามร้านค้า', 'c2')}</div>` +
      `<div class="glass rv" style="margin-top:20px"><h3>รายการค่าใช้จ่าย (100 แถวแรก)</h3><div class="tbl"><table><tr><th>วันที่</th><th>ประเภท</th><th>ร้านค้า</th><th>จำนวนเงิน</th></tr>` +
      R.slice(0, 100).map(r => `<tr><td>${r.iso}</td><td>${r.cat}</td><td>${r.st}</td><td>${r.amt.toLocaleString('th-TH')}</td></tr>`).join('') + `</table></div></div>`;
    mk('c1', pieCfg(FCAT, catT));
    mk('c2', barCfg(FST, stT, '#8ab4ff'));

}

const ORD = {};
let TMP = {}, EDIT = false;
function ebar() {}
function applyOrder() {
  document.querySelectorAll('.charts').forEach((el, idx) => {
    const key = S.v + '#' + idx, ord = EDIT && TMP[key] ? TMP[key] : ORD[key];
    if (ord) ord.forEach(cid => { const n = el.querySelector(`[data-cid="${cid}"]`); if (n) el.appendChild(n); });
  });
}
function moveCard(btn, dir) {
  const card = btn.closest('[data-cid]'), box = card.parentElement;
  const key = S.v + '#' + [...document.querySelectorAll('.charts')].indexOf(box);
  const sib = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if (!sib || !sib.dataset.cid) return;
  if (dir < 0) box.insertBefore(card, sib); else box.insertBefore(sib, card);
  TMP[key] = [...box.querySelectorAll('[data-cid]')].map(n => n.dataset.cid);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit],[data-ok],[data-cancel],[data-up],[data-dn]'); if (!b) return;
  if (b.hasAttribute('data-edit')) { EDIT = true; render(); }
  else if (b.hasAttribute('data-ok')) { Object.assign(ORD, TMP); TMP = {}; EDIT = false; render(); }
  else if (b.hasAttribute('data-cancel')) { TMP = {}; EDIT = false; render(); }
  else moveCard(b, b.hasAttribute('data-up') ? -1 : 1);
});

document.addEventListener('click', e => {
  const card = e.target.closest('.charts .glass[data-cid]');
  if (!card || (e.target.closest('button') && !e.target.closest('[data-x]'))) return;
  card.classList.toggle('open');
  const x = card.querySelector('[data-x]');

});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tb]'); if (!b) return;
  const t = b.closest('.glass').querySelector('.tbl');
  const show = t.style.display === 'none';
  t.style.display = show ? 'block' : 'none';
  b.textContent = show ? 'ซ่อนตาราง' : 'ดูตาราง';
});

function render() {
  sxOff();
  kill();
  /* หน้าแดชบอร์ดใช้ธีม Power BI ส่วนหน้าแรกใช้ธีม Excel */
  const pb = S.v !== 'intro'; document.documentElement.classList.toggle('pbi', pb); PAL = pb ? PAL_PBI : PAL_XL;
  document.querySelectorAll('aside [data-v],#tabs [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === S.v));
  { const T = { intro: 'หน้าแรก', home: 'ภาพรวมธุรกิจ', food: 'ธุรกิจอาหาร', online: 'ขายของออนไลน์', social: 'วัดผลโซเชียล', fin: 'รายรับ / รายจ่าย' }, f = document.getElementById('fxt'); if (f) f.textContent = '=DASHBOARD("' + T[S.v] + '")'; }
  document.body.classList.toggle('isIntro', S.v === 'intro');
  if (S.v === 'intro') viewIntro(); else if (S.v === 'home') viewHome(); else if (S.v === 'fin') viewFin(); else viewBiz(S.v);

  applyChartTheme();
  observe();
}

const io = new IntersectionObserver(es => es.forEach(e => {
  e.target.classList.toggle('in', e.isIntersecting);
  if (!e.isIntersecting) return;
  e.target.querySelectorAll('canvas').forEach(cv => { const c = Chart.getChart(cv); if (c) { c.reset(); c.update(); } });
}), { threshold: .15 });
function observe() { document.querySelectorAll('.rv').forEach(el => io.observe(el)); }

Chart.register({ id: 'run', afterDatasetsDraw(c) {
  if (true) return;
  const pts = c.getDatasetMeta(0).data;
  if (pts.length < 2) return;
  const f = ((performance.now() / 3000) % 1) * (pts.length - 1), i = Math.floor(f), j = Math.min(i + 1, pts.length - 1), k = f - i;
  const x = pts[i].x + (pts[j].x - pts[i].x) * k, y = pts[i].y + (pts[j].y - pts[i].y) * k;
  const ctx = c.ctx; ctx.save(); ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffb37a'; ctx.shadowBlur = 18; ctx.fill(); ctx.restore();
} });
(function loop() { charts.forEach(c => { if (c.options.plugins && c.options.plugins.run) c.draw(); }); requestAnimationFrame(loop); })();

document.addEventListener('click', e => {
  const t = e.target.closest('[data-v],[data-m],[data-f],[data-menu]');
  if (!t) return;
  if (t.dataset.v) { S.v = t.dataset.v; document.body.classList.remove('open'); }
  else if (t.dataset.m !== undefined) S.m = +t.dataset.m;
  else if (t.dataset.menu !== undefined) S.menu = t.dataset.menu;
  else S.fm = t.dataset.f;
  render();
  if (!t.dataset.menu) window.scrollTo(0, 0);
});
let SND = true, AC = null;
function tick() {
  if (!SND) return;
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(700, t + .05);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .1);
}
const ICON_MOON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const OLDHEX = {'#ffb37a':'--c1','#4fd1c5':'--c2','#8ab4ff':'--c3','#c9a7ff':'--c4','#ff8fb1':'--c5','#f6e05e':'--c6'};
const OLDRGB = {'255,179,122':'--c1','79,209,197':'--c2','138,180,255':'--c3','201,167,255':'--c4','255,143,177':'--c5','246,224,94':'--c6'};
const toRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); };
function recolor(cs) {
  const val = v => cs.getPropertyValue(v).trim();
  window.C1RGB = toRGB(val('--c1'));
  const conv = v => {
    if (Array.isArray(v)) return v.map(conv);
    if (typeof v !== 'string') return v;
    const k = v.toLowerCase();
    if (OLDHEX[k]) return val(OLDHEX[k]);
    const m = v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) { const key = m[1] + ',' + m[2] + ',' + m[3]; if (OLDRGB[key]) return v.replace(m[0], (m[0].startsWith('rgba') ? 'rgba(' : 'rgb(') + toRGB(val(OLDRGB[key]))); }
    return v;
  };
  charts.forEach(c => c.data.datasets.forEach(d => ['borderColor', 'backgroundColor', 'pointBackgroundColor', 'pointHoverBackgroundColor', 'pointHoverBorderColor'].forEach(k => {
    if (d[k] === undefined || typeof d[k] === 'function') return;
    d.$o = d.$o || {}; if (!(k in d.$o)) d.$o[k] = d[k];
    d[k] = conv(d.$o[k]);
  })));
}
function applyChartTheme() {
  const cs = getComputedStyle(document.documentElement), col = cs.getPropertyValue('--ct').trim(), grid = cs.getPropertyValue('--cg').trim();
  Chart.defaults.color = col;
  recolor(cs);
  charts.forEach(c => {
    const o = c.options;
    if (o.plugins && o.plugins.legend && o.plugins.legend.labels) o.plugins.legend.labels.color = col;
    if (o.plugins && o.plugins.tooltip) { const dk = document.documentElement.classList.contains('dark'); Object.assign(o.plugins.tooltip, { backgroundColor: dk ? 'rgba(16,18,26,.94)' : 'rgba(255,255,255,.97)', borderColor: dk ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.12)', titleColor: dk ? '#ffffff' : '#141416', bodyColor: dk ? '#f5f5f7' : '#141416' }); }
    if (o.scales) Object.values(o.scales).forEach(s => { if (s.ticks) s.ticks.color = col; if (s.grid) s.grid.color = grid; });
    c.update('none');
  });
}
function setMode(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $('#thm').innerHTML = dark ? ICON_SUN : ICON_MOON;
  applyChartTheme();
}
$('#thm').onclick = () => setMode(!document.documentElement.classList.contains('dark'));
document.addEventListener('click', e => { if (e.target.closest('button, a.pill, [data-v], [data-m], [data-f], [data-menu]')) tick(); }, true);
$('#menu').onclick = () => { const o = document.body.classList.toggle('open'); $('#menu').setAttribute('aria-expanded', o); };

const SPL = document.getElementById('splash'), SPL_T0 = Date.now();
let splDone = false;
function hideSplash() {
  if (splDone) return; splDone = true;
  const wait = Math.max(0, 1400 - (Date.now() - SPL_T0));

}
if (document.readyState === 'complete') hideSplash(); else addEventListener('load', hideSplash);
setTimeout(hideSplash, 6000);

/* แถบหัวคอลัมน์ A, B, C... และเลขแถวแบบ Excel (ตกแต่งอย่างเดียว) */
(function () {
  let h = '<b></b>', r = '';
  for (let i = 0; i < 40; i++) { let n = i, s = ''; do { s = String.fromCharCode(65 + n % 26) + s; n = Math.floor(n / 26) - 1; } while (n >= 0); h += '<span>' + s + '</span>'; }
  for (let i = 1; i <= 60; i++) r += '<span>' + i + '</span>';

setMode(false);
